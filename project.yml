name: M8UeXControlCentre
options:
  bundleIdPrefix: is.nnv.m8uex
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  M8UeXControlCentre:
    type: application
    platform: macOS
    sources:
      - path: Sources/M8UeXControlCentre
    settings:
      base:
        PRODUCT_NAME: M8U eX Control Centre
        PRODUCT_BUNDLE_IDENTIFIER: is.nnv.m8uex.controlcentre
        INFOPLIST_FILE: Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/M8UeXControlCentre/M8UeXControlCentre-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: CoreMIDI.framework
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: UniformTypeIdentifiers.framework
